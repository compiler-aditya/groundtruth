<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GroundTruth ad</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #0f0f0f; --ink: #f5f3ee; --muted: #9b9890; --faint: #5c5a55; --o: #ff4c00; --o2: #ff7a3d; --good: #22c55e; --bad: #ef4444; --warn: #f5a524; --blue: #4f8cff;
  --disp: "Space Grotesk", Inter, sans-serif; --sans: Inter, sans-serif; --mono: "JetBrains Mono", monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
#grid { position: absolute; inset: -60px; background-image: radial-gradient(rgba(255,255,255,.075) 1.3px, transparent 1.5px); background-size: 34px 34px; }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); z-index: 50; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 60; pointer-events: none; }
.scene { position: absolute; inset: 0; display: none; }
.abs { position: absolute; }
.center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; }
.w { display: inline-block; will-change: transform, opacity, filter; white-space: pre; }
.big { font: 700 150px/0.95 var(--disp); letter-spacing: -.05em; }
.huge { font: 700 260px/0.9 var(--disp); letter-spacing: -.06em; }
.h1 { font: 700 104px/1 var(--disp); letter-spacing: -.045em; }
.h2 { font: 600 64px/1.05 var(--disp); letter-spacing: -.035em; }
.h3 { font: 600 40px/1.15 var(--disp); letter-spacing: -.02em; }
.kick { font: 600 22px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--o); }
.o { color: var(--o); } .mut { color: var(--muted); } .good { color: var(--good); } .bad { color: var(--bad); }
.chip { display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px; border-radius: 999px; font: 600 26px var(--sans); background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.14); color: var(--ink); white-space: nowrap; }
.chip.m { font: 600 24px var(--mono); }
.chip .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--o); }
.chip.okc { border-color: rgba(34,197,94,.55); background: rgba(34,197,94,.12); }
.chip.badc { border-color: rgba(239,68,68,.6); background: rgba(239,68,68,.13); }
.card { background: #1b1b1b; border: 1.5px solid #2c2c2c; border-radius: 18px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.7); }
.win { position: absolute; border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 50px 120px -30px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.08); }
.win iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #fff; }
.win img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.bar { position: absolute; left: 0; right: 0; top: 0; height: 0; }
.tick { stroke-linecap: round; stroke-linejoin: round; fill: none; }
.mono { font-family: var(--mono); }
.label { font: 600 20px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.code { font: 500 30px/1.6 var(--mono); color: #e8e6e1; white-space: pre; }
.code .k { color: #ff7a3d; } .code .s { color: #8bd17c; } .code .c { color: #6f6d67; }
.pin { position: absolute; width: 34px; height: 34px; border-radius: 50%; background: var(--bad); border: 3px solid #fff; box-shadow: 0 6px 20px rgba(239,68,68,.6); display: grid; place-items: center; font: 700 16px var(--sans); color: #fff; }
.sub { font: 600 34px/1.35 var(--sans); }
.cap { position: absolute; width: 270px; height: 230px; border-radius: 14px; background: #1c1c1c; border: 1.5px solid #333; overflow: hidden; }
.cap .im { position: absolute; left: 0; right: 0; top: 0; height: 168px; display: grid; place-items: center; background: #262626; }
.cap .im img { width: 100%; height: 100%; object-fit: cover; }
.cap .t { position: absolute; left: 14px; bottom: 12px; right: 10px; font: 600 20px var(--mono); color: var(--ink); }
.cap .t span { display: block; font: 500 15px var(--sans); color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="stage"><div id="grid"></div><div id="scenes"></div><div id="vignette"></div><div id="flash"></div></div>
<script src="assets/data.js"></script>
<script src="ad.js"></script>
</body>
</html>
